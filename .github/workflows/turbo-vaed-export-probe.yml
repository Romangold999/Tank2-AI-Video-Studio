name: Turbo-VAED LTX decoder ONNX export probe

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/export_turbo_vaed_ltx_onnx.py'
      - '.github/workflows/turbo-vaed-export-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Clone official Turbo-VAED source
        run: git clone --depth 1 https://github.com/hustvl/Turbo-VAED.git Turbo-VAED

      - name: Install CPU export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.0
          python -m pip install "numpy<2" "onnx==1.17.0" "onnxruntime==1.20.1" "huggingface_hub==0.35.3" "safetensors" "transformers==4.57.0" "accelerate" "timm==1.0.20"

      - name: Export official Turbo-VAED LTX decoder and compare with PyTorch
        env:
          HF_HUB_DISABLE_XET: "1"
          TURBO_VAED_SOURCE: Turbo-VAED
        run: python tools/export_turbo_vaed_ltx_onnx.py

      - name: Upload Turbo-VAED export probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-vaed-ltx-decoder-export-probe
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
