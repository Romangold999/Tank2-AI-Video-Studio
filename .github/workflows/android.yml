name: Android build and real-image generation test
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build:
    # Public-repository standard Linux runner: 4 vCPU / 16 GB RAM.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare a real public-domain photograph for end-to-end inference
        run: |
          set -euxo pipefail
          mkdir -p app/src/androidTest/assets ci-artifacts
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/scikit-image/scikit-image/v0.21.0/skimage/data/astronaut.png \
            -o app/src/androidTest/assets/ci-source.png
          file app/src/androidTest/assets/ci-source.png
          test "$(stat -c%s app/src/androidTest/assets/ci-source.png)" -gt 10000
          cp app/src/androidTest/assets/ci-source.png ci-artifacts/source-image.png
          sha256sum ci-artifacts/source-image.png
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and generic x86_64 emulator image
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-34;google_apis;x86_64"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download the already-built APK from run 118 (do not rebuild it)
        uses: actions/download-artifact@v4
        with:
          name: Tank2-AI-Video-Studio-embedded-models-debug
          path: ci-existing-apk
          run-id: 43347242486
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and preserve the existing APK from run 118 (no APK rebuild)
        run: |
          set -euxo pipefail
          test -s ci-existing-apk/app-debug.apk
          stat -c "REUSED_APK_BYTES=%s" ci-existing-apk/app-debug.apk
          sha256sum ci-existing-apk/app-debug.apk
      - name: Install emulator runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Create generic Android 14 x86_64 AVD
        run: |
          set -euxo pipefail
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          unset XDG_CONFIG_HOME
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\\n' | avdmanager create avd --name ci_android_x86_64 --package "system-images;android-34;google_apis;x86_64" --device "pixel_6" --path "$HOME/.android/avd/ci_android_x86_64.avd" --force
          AVD_CONFIG="$HOME/.android/avd/ci_android_x86_64.avd/config.ini"
          if [ ! -f "$AVD_CONFIG" ]; then
            echo "AVD manager did not create expected config file"
            find "$HOME/.android/avd" -maxdepth 3 -type f -print || true
            avdmanager list avd || true
            exit 1
          fi
          {
            echo "hw.lcd.width=1080"
            echo "hw.lcd.height=1920"
            echo "hw.lcd.density=420"
            echo "hw.ramSize=6144"
            echo "vm.heapSize=512"
            echo "hw.cpu.ncore=4"
            echo "hw.gpu.enabled=yes"
            echo "hw.gpu.mode=swiftshader_indirect"
            echo "hw.keyboard=yes"
          } >> "$AVD_CONFIG"
          cat "$AVD_CONFIG"
          echo "=== AVDs visible to emulator ==="
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx "ci_android_x86_64"
      - name: Boot emulator and run real-photo inference with 5-second live diagnostics
        id: android_tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_DIAGNOSTICS_BRANCH: live-diagnostics
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          printf 'STATUS=STARTING\nUTC=%s\n' "$(date -u +%FT%TZ)" > live-status.txt
          python3 scripts/publish-live-diagnostics.py &
          PUBLISHER_PID=$!
          echo "$PUBLISHER_PID" > diagnostics-publisher.pid
          for attempt in $(seq 1 30); do
            if [ -f live-publisher.ready ]; then break; fi
            if ! kill -0 "$PUBLISHER_PID" 2>/dev/null; then
              wait "$PUBLISHER_PID" || true
              echo "Live diagnostics publisher failed before confirming GitHub write access"
              exit 1
            fi
            sleep 1
          done
          if [ ! -f live-publisher.ready ]; then
            echo "Live diagnostics publisher did not confirm remote writes within 30 seconds"
            exit 1
          fi
          echo "LIVE_DIAGNOSTICS_READY interval_seconds=5 branch=live-diagnostics"
          cleanup() {
            if kill -0 "$PUBLISHER_PID" 2>/dev/null; then
              kill -TERM "$PUBLISHER_PID" 2>/dev/null || true
              wait "$PUBLISHER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          unset XDG_CONFIG_HOME
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT and ANDROID_HOME are both unset"
            env | grep -E "^(ANDROID|PATH)=" || true
            exit 1
          fi
          EMULATOR_BIN="$SDK_ROOT/emulator/emulator"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "Checking emulator binary: $EMULATOR_BIN"
          if [ ! -x "$EMULATOR_BIN" ]; then
            echo "Android Emulator binary is missing or not executable"
            ls -la "$SDK_ROOT" "$SDK_ROOT/emulator" 2>&1 || true
            find "$SDK_ROOT" -maxdepth 4 -type f -name emulator -print 2>/dev/null || true
            exit 1
          fi
          "$EMULATOR_BIN" -version
          adb start-server
          printf 'STATUS=EMULATOR_STARTING\nUTC=%s\n' "$(date -u +%FT%TZ)" > live-status.txt
          "$EMULATOR_BIN" -avd ci_android_x86_64 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -memory 6144 -cores 4 -port 5554 > emulator-startup.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > emulator.pid
          BOOTED=0
          for i in $(seq 1 120); do
            ELAPSED=$((i * 5))
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              printf 'STATUS=EMULATOR_PROCESS_EXITED\nELAPSED_SECONDS=%s\n' "$ELAPSED" > live-status.txt
              echo "EMULATOR_PROCESS_EXITED elapsed_seconds=$ELAPSED"
              cat emulator-startup.log || true
              exit 1
            fi
            DEVICE_STATE="$(adb devices 2>/dev/null | awk '$1=="emulator-5554" {print $2; exit}')"
            BOOT_COMPLETED=""
            if [ "$DEVICE_STATE" = "device" ]; then
              BOOT_COMPLETED="$(timeout 10s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            fi
            printf 'STATUS=EMULATOR_BOOT_WAIT\nELAPSED_SECONDS=%s\nEMULATOR_PID=%s\nADB_DEVICE_STATE=%s\nBOOT_COMPLETED=%s\n' "$ELAPSED" "$EMULATOR_PID" "${DEVICE_STATE:-not-seen}" "${BOOT_COMPLETED:-not-yet}" > live-status.txt
            echo "EMULATOR_BOOT_WAIT elapsed_seconds=$ELAPSED adb_state=${DEVICE_STATE:-not-seen} boot_completed=${BOOT_COMPLETED:-not-yet}"
            if [ "$BOOT_COMPLETED" = "1" ]; then BOOTED=1; break; fi
            sleep 5
          done
          if [ "$BOOTED" != "1" ]; then
            printf 'STATUS=EMULATOR_BOOT_TIMEOUT\nUTC=%s\n' "$(date -u +%FT%TZ)" > live-status.txt
            echo "Android emulator did not finish booting within 10 minutes"
            echo "=== EMULATOR STARTUP LOG ==="
            tail -300 emulator-startup.log || true
            echo "=== ADB DEVICES ==="
            adb devices -l || true
            exit 1
          fi

          printf 'STATUS=EMULATOR_READY\nUTC=%s\n' "$(date -u +%FT%TZ)" > live-status.txt
          adb -s emulator-5554 shell wm size 1080x1920
          adb -s emulator-5554 shell wm density 420
          echo "=== DEVICE INFO ==="
          adb -s emulator-5554 shell getprop ro.build.version.release
          adb -s emulator-5554 shell getprop ro.product.cpu.abi
          adb -s emulator-5554 shell cat /proc/meminfo | head
          adb -s emulator-5554 logcat -c
          adb -s emulator-5554 logcat -v threadtime > emulator-logcat.txt 2>&1 &
          LOGCAT_PID=$!
          echo "$LOGCAT_PID" > logcat.pid

          printf 'STATUS=INSTALLING_REUSED_APK\\nUTC=%s\\n' "$(date -u +%FT%TZ)" > live-status.txt
          adb install -r ci-existing-apk/app-debug.apk
          adb shell mkdir -p /sdcard/Pictures
          printf 'STATUS=ANDROID_UI_GENERATION_TEST_RUNNING\\nUTC=%s\\n' "$(date -u +%FT%TZ)" > live-status.txt
          set +e
          python3 scripts/run-real-image-ui-test.py 2>&1 | tee gradle-instrumented-test.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          printf 'STATUS=ANDROID_UI_TEST_FINISHED\\nTEST_EXIT_CODE=%s\\nUTC=%s\\n' "$TEST_STATUS" "$(date -u +%FT%TZ)" > live-status.txt
          echo "ANDROID_UI_TEST_EXIT_CODE=$TEST_STATUS"
          kill "$LOGCAT_PID" 2>/dev/null || true
          sleep 6
          exit "$TEST_STATUS"
      - name: Collect generated media, live logs and device diagnostics
        if: always()
        run: |
          mkdir -p ci-artifacts
          DEVICE_DIR="/sdcard/Android/data/com.romangold.tank2aivideostudio.debug/files"
          adb devices || true
          adb pull "$DEVICE_DIR/ci-source.png" ci-artifacts/source-image-from-device.png || true
          adb pull "$DEVICE_DIR/ci-generated.mp4" ci-artifacts/generated-video.mp4 || true
          adb pull "$DEVICE_DIR/ci-generated-frame.jpg" ci-artifacts/generated-frame-preview.jpg || true
          adb pull "$DEVICE_DIR/ci-video-preview.jpg" ci-artifacts/video-first-frame-preview.jpg || true
          adb pull "$DEVICE_DIR/ci-generation-summary.txt" ci-artifacts/generation-summary.txt || true
          adb shell dumpsys meminfo com.romangold.tank2aivideostudio.debug > ci-artifacts/device-meminfo.txt 2>&1 || true
          cp gradle-instrumented-test.log ci-artifacts/ 2>/dev/null || true
          cp emulator-logcat.txt ci-artifacts/ 2>/dev/null || true
          cp emulator-startup.log ci-artifacts/ 2>/dev/null || true
          ls -lh ci-artifacts || true
      - name: Upload real-image generation output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-image-generation-and-detailed-logs
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
