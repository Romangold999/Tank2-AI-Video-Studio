name: Android build and real-image generation test
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    # Public-repository standard Linux runner: 4 vCPU / 16 GB RAM.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare a real public-domain photograph for end-to-end inference
        run: |
          set -euxo pipefail
          mkdir -p app/src/androidTest/assets ci-artifacts
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/scikit-image/scikit-image/v0.21.0/skimage/data/astronaut.png \
            -o app/src/androidTest/assets/ci-source.png
          file app/src/androidTest/assets/ci-source.png
          test "$(stat -c%s app/src/androidTest/assets/ci-source.png)" -gt 10000
          cp app/src/androidTest/assets/ci-source.png ci-artifacts/source-image.png
          sha256sum ci-artifacts/source-image.png
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and generic x86_64 emulator image
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-34;google_apis;x86_64"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Embed all ONNX models in APK assets
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets/models app/src/main/assets/licenses
          BASE="https://github.com/Romangold999/Tank2-AI-Video-Studio/releases/download/tank2-models-v0.1.0"
          curl --fail --location --retry 5 --retry-all-errors "$BASE/models-manifest.json" -o app/src/main/assets/models/models-manifest.json
          for model in ltx_open_vae_encoder.onnx mobiledit_300m.onnx turbo_vaed_ltx_decoder.onnx; do
            curl --fail --location --retry 5 --retry-all-errors "$BASE/$model" -o "app/src/main/assets/models/$model"
            test -s "app/src/main/assets/models/$model"
          done
          curl --fail --location --retry 5 --retry-all-errors --output app/src/main/assets/models/rife49.onnx "https://huggingface.co/edgetools/rife/resolve/18dcfbe2c349d5922e353708153581d2039c576c/rife49.onnx?download=true"
          stat -c "RIFE_BYTES=%s" app/src/main/assets/models/rife49.onnx
          test "$(stat -c%s app/src/main/assets/models/rife49.onnx)" = "21458882"
          echo "76e4cef9ab42fa7dd4e8f6e4aba47462051e3faa969e4bca6479784fbab0ac6f  app/src/main/assets/models/rife49.onnx" | sha256sum --check
          curl --fail --location --retry 5 --retry-all-errors --output app/src/main/assets/licenses/LTX-Video-Open-Weights-License-0.X.pdf https://static.lightricks.com/legal/LTX-Video-Open-Weights-License-0.X.pdf
          file app/src/main/assets/licenses/LTX-Video-Open-Weights-License-0.X.pdf | grep -q PDF
          echo "=== Embedded model sizes ==="
          ls -lh app/src/main/assets/models
          du -sh app/src/main/assets/models
          df -h .
      - name: Build APK with embedded models
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          stat -c "APK_BYTES=%s" app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK with embedded models
        uses: actions/upload-artifact@v4
        with:
          name: Tank2-AI-Video-Studio-embedded-models-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Create generic Android 14 x86_64 AVD
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android/avd"
          printf 'no\\n' | avdmanager create avd --name ci_android_x86_64 --package "system-images;android-34;google_apis;x86_64" --device "pixel_6" --path "$HOME/.android/avd/ci_android_x86_64.avd" --force
          AVD_CONFIG="$HOME/.android/avd/ci_android_x86_64.avd/config.ini"
          if [ ! -f "$AVD_CONFIG" ]; then
            echo "AVD manager did not create expected config file"
            find "$HOME/.android/avd" -maxdepth 3 -type f -print || true
            avdmanager list avd || true
            exit 1
          fi
          {
            echo "hw.lcd.width=1080"
            echo "hw.lcd.height=1920"
            echo "hw.lcd.density=420"
            echo "hw.ramSize=6144"
            echo "vm.heapSize=512"
            echo "hw.cpu.ncore=4"
            echo "hw.gpu.enabled=yes"
            echo "hw.gpu.mode=swiftshader_indirect"
            echo "hw.keyboard=yes"
          } >> "$AVD_CONFIG"
          cat "$AVD_CONFIG"
      - name: Boot emulator and run real-photo inference with live diagnostics
        id: android_tests
        run: |
          set -euo pipefail
          emulator -avd ci_android_x86_64 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -memory 6144 -cores 4 > emulator-startup.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > emulator.pid
          adb wait-for-device
          BOOTED=0
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" = "1" ]; then BOOTED=1; break; fi
            echo "EMULATOR_BOOT_WAIT elapsed_seconds=$((i * 5))"
            sleep 5
          done
          if [ "$BOOTED" != "1" ]; then
            echo "Android emulator did not finish booting within 10 minutes"
            tail -200 emulator-startup.log || true
            exit 1
          fi
          adb shell wm size 1080x1920
          adb shell wm density 420
          echo "=== DEVICE INFO ==="
          adb shell getprop ro.build.version.release
          adb shell getprop ro.product.cpu.abi
          adb shell cat /proc/meminfo | head
          adb logcat -c
          # Keep the complete logcat file and stream progress/errors into the live Actions console.
          adb logcat -v threadtime 2>&1 | tee emulator-logcat.txt | grep --line-buffered -E 'RealImageI2V|AndroidRuntime|FATAL EXCEPTION|ANR in|OutOfMemoryError|Fatal signal' &
          LOGCAT_PID=$!
          echo "$LOGCAT_PID" > logcat.pid
          set +e
          gradle --no-daemon :app:connectedDebugAndroidTest --info --console=plain 2>&1 | tee gradle-instrumented-test.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          echo "INSTRUMENTED_TEST_EXIT_CODE=$TEST_STATUS"
          kill "$LOGCAT_PID" 2>/dev/null || true
          exit "$TEST_STATUS"
      - name: Collect generated media, live logs and device diagnostics
        if: always()
        run: |
          mkdir -p ci-artifacts
          DEVICE_DIR="/sdcard/Android/data/com.romgold.tank2aivideostudio.debug/files"
          adb devices || true
          adb pull "$DEVICE_DIR/ci-source.png" ci-artifacts/source-image-from-device.png || true
          adb pull "$DEVICE_DIR/ci-generated.mp4" ci-artifacts/generated-video.mp4 || true
          adb pull "$DEVICE_DIR/ci-generated-frame.jpg" ci-artifacts/generated-frame-preview.jpg || true
          adb pull "$DEVICE_DIR/ci-video-preview.jpg" ci-artifacts/video-first-frame-preview.jpg || true
          adb pull "$DEVICE_DIR/ci-generation-summary.txt" ci-artifacts/generation-summary.txt || true
          adb shell dumpsys meminfo com.romgold.tank2aivideostudio.debug > ci-artifacts/device-meminfo.txt 2>&1 || true
          cp gradle-instrumented-test.log ci-artifacts/ 2>/dev/null || true
          cp emulator-logcat.txt ci-artifacts/ 2>/dev/null || true
          cp emulator-startup.log ci-artifacts/ 2>/dev/null || true
          ls -lh ci-artifacts || true
      - name: Upload real-image generation output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-image-generation-and-detailed-logs
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
